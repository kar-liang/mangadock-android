name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # ubuntu-latest 自带 Android SDK，别再调 android-actions/setup-android@v3：
      # 那个 action 会去装 "tools" 包，新版 sdkmanager 里已经没有这个名字，必然失败。
      - name: 补齐 SDK 平台与 build-tools
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMGR=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "ANDROID_HOME=$SDK"
          echo "sdkmanager=$SDKMGR"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 构建 debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: mangadock-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
